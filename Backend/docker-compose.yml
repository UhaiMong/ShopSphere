version: '3.9'

services:
  # ── ShopSphere API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: builder        # Use builder stage with tsx for hot-reload
    command: npx tsx watch src/server.ts
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://root:secret@mongo:27017/shopsphere?authSource=admin
      JWT_ACCESS_SECRET: dev_access_secret_min_32_chars_here_xxx
      JWT_REFRESH_SECRET: dev_refresh_secret_min_32_chars_here_yyy
      JWT_ACCESS_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      CLIENT_URL: http://localhost:3000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 1000    # Relaxed for dev
    volumes:
      - ./src:/app/src        # Hot reload: mount source directory
      - /app/node_modules     # Exclude node_modules from mount
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shopsphere

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: shopsphere
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shopsphere

  # ── Mongo Express (GUI) ─────────────────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret
      ME_CONFIG_MONGODB_URL: mongodb://root:secret@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - shopsphere

volumes:
  mongo_data:

networks:
  shopsphere:
    driver: bridge
